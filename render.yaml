services:
  - type: web
    name: academic-load-radar
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m compileall app
    startCommand: python -m app.main
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ACADEMIC_LOAD_RADAR_DATA
        value: /tmp/academic-load-radar
